name: Check prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and verify Pages
        run: |
          npm run build -- --outDir dist/pages
          node scripts/check-build-assets.mjs dist/pages /galaxy-grown-games/
      - name: Build and verify Sites
        run: |
          npm run build:sites -- --outDir dist/sites
          node scripts/check-build-assets.mjs dist/sites /
